# devkit: standard tasks for HiQDev projects, the same in each; mise pins the tools, hk runs the checks.
# New project: devkit init (mise use -g pipx:hiqdev/devkit), or uvx copier copy --trust gh:hiqdev/devkit .
# Later: devkit update

_subdirectory: template
_templates_suffix: .jinja
# hk and mise use {{ }} themselves, so the template marks its own with [[ ]] and [% %]
_envops:
  block_start_string: "[%"
  block_end_string: "%]"
  variable_start_string: "[["
  variable_end_string: "]]"
  comment_start_string: "[#"
  comment_end_string: "#]"
  keep_trailing_newline: true
# the project's own: written once, never overwritten
_skip_if_exists:
  - mise.toml
  - hk.pkl
  - .markdownlint.yaml
  - .vale/styles/config/vocabularies/Wiki/accept.txt
  - /AGENTS.md                   # the project root's; .config/devkit/AGENTS.md is devkit's
_message_after_copy: |
  Next: mise run check; devkit doctor says what keeps it from running. Without the devkit command:
  mise trust && mise install && mise run check, then mise run hooks for the pre-commit hook.

vault:
  type: str
  default: "."
  help: Folder uwiki checks as the vault, from the project root

uwiki:
  type: str
  default: "0.31.0"
  help: "uwiki release mise.toml pins at first, the project's to bump later; checkout in uwiki's own repo runs its .venv"

ci:
  type: str
  default: github
  choices: [github, gitlab, none]
  help: "CI that runs mise run check: github writes a workflow, gitlab hidden jobs .gitlab-ci.yml extends"

wrap:
  type: bool
  default: false
  help: Paragraphs and list items wrapped, uwiki wrap --check; the width comes from uwiki

python:
  type: bool
  default: false
  help: Python code checked with ruff check and ruff format --check; rules in .config/devkit/ruff.toml, pyproject.toml extends it

releases:
  type: str
  default: none
  choices: [none, python]
  help: "python: patch, minor, major tag the version of a Python package; release pushes it; up installs it"

version_file:
  type: str
  default: src/[[ _folder_name ]]/__init__.py
  when: "[[ releases == 'python' ]]"
  help: File holding __version__ = "X.Y.Z"

package:
  type: str
  default: pipx:hiqsol/[[ _folder_name ]]
  when: "[[ releases == 'python' ]]"
  help: mise package of a release, up installs it

command:
  type: str
  default: "[[ _folder_name ]]"
  when: "[[ releases == 'python' ]]"
  help: Command the package installs, up checks its --version

branch:
  type: str
  default: master
  when: "[[ releases == 'python' ]]"
  help: Branch release pushes with the tag
